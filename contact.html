<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact &amp; Support - GlobalMall</title>
<style>
:root{--bg:#f6f4fa;--card:#fff;--ink:#23202e;--muted:#6d6880;--line:#e3deee;--brand:#4a2fa3;--accent:#f59e0b;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121d;--card:#201c2b;--ink:#f1eef8;--muted:#a9a2bd;--line:#37314a;--brand:#9b86f0;--onbrand:#15121d}}
:root[data-theme="dark"]{--bg:#15121d;--card:#201c2b;--ink:#f1eef8;--muted:#a9a2bd;--line:#37314a;--brand:#9b86f0;--onbrand:#15121d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:800;font-size:1.5rem;color:var(--brand);text-decoration:none;letter-spacing:-.5px}
.back{color:var(--brand);font-weight:600;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:1.7rem;margin:6px 0 4px}
.nm{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.box input,.box textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);width:100%;resize:vertical}
.go{display:block;text-align:center;background:var(--brand);color:var(--onbrand);padding:11px;border-radius:8px;font-weight:700;text-decoration:none;border:0;cursor:pointer;width:100%}
.go.alt{background:none;color:var(--brand);border:1.5px solid var(--brand)}
.two{display:flex;gap:8px}.two .go{font-size:.9rem}
.go:focus-visible,.back:focus-visible,.logo:focus-visible,.fab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25a244;color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="top"><div class="bar"><a class="logo" href="index.html">GlobalMall</a><a class="back" href="index.html">&larr; Shop par wapas</a></div></div>
<div class="wrap">
 <h1>Contact &amp; Support</h1>
 <p class="nm">Order, delivery ya kisi bhi sawaal ke liye humse sampark karein.</p>
 <div class="grid">
  <div class="box"><b>WhatsApp</b><span class="nm">Seedha chat karein</span><a class="go" id="wachat" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a></div>
  <div class="box"><b>Email</b><span class="nm" id="emailtxt"></span><a class="go alt" id="mailbtn" href="#">Send Email</a></div>
  <div class="box"><b>Apna message likhein</b><input id="cn" placeholder="Aapka naam" aria-label="Name"><textarea id="cm" rows="4" placeholder="Aapka sawaal ya problem" aria-label="Message"></textarea><div class="two"><button class="go" id="sendwa">WhatsApp se bhejein</button><button class="go alt" id="sendmail">Email se bhejein</button></div></div>
 </div>
</div>
<a class="fab" id="fab" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">&#128172; WhatsApp</a>
<script>
// ===== EDIT HERE: index.html wala hi number aur email yahan bhi daalein =====
var WHATSAPP = "91XXXXXXXXXX"; // country code ke saath, bina +
var EMAIL = "aapka-email@example.com";
// ===========================================================================
function $(i){return document.getElementById(i)}
var HI="Hello GlobalMall, mujhe help chahiye.";
$("wachat").href=$("fab").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(HI);
$("mailbtn").href="mailto:"+EMAIL+"?subject="+encodeURIComponent("Support - GlobalMall");
$("emailtxt").textContent=EMAIL;
function cmsg(){var n=$("cn").value.trim(),m=$("cm").value.trim();return (n?"Naam: "+n+"\n":"")+(m||"Mujhe help chahiye.")}
$("sendwa").onclick=function(){window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello GlobalMall,\n"+cmsg()),"_blank")};
$("sendmail").onclick=function(){location.href="mailto:"+EMAIL+"?subject="+encodeURIComponent("Support - GlobalMall")+"&body="+encodeURIComponent(cmsg())};
</script>
</body>
</html>
