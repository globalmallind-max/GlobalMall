<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlobalMall - Online Shopping</title>
<style>
:root{--bg:#f6f4fa;--card:#fff;--ink:#23202e;--muted:#6d6880;--line:#e3deee;--brand:#4a2fa3;--accent:#f59e0b;--green:#0b8a4b;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121d;--card:#201c2b;--ink:#f1eef8;--muted:#a9a2bd;--line:#37314a;--brand:#9b86f0;--green:#43c883;--onbrand:#15121d}}
:root[data-theme="dark"]{--bg:#15121d;--card:#201c2b;--ink:#f1eef8;--muted:#a9a2bd;--line:#37314a;--brand:#9b86f0;--green:#43c883;--onbrand:#15121d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{font-weight:800;font-size:1.5rem;color:var(--brand);letter-spacing:-.5px;white-space:nowrap}
.search{flex:1;max-width:520px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
.cartbtn{border:0;background:none;cursor:pointer;font-weight:600;padding:6px 10px;white-space:nowrap}
.nav{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.nav button{border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:6px;white-space:nowrap;color:var(--muted);font-size:.92rem}
.nav button.on{color:var(--brand);font-weight:700;background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.slider{position:relative;border-radius:14px;overflow:hidden;background:var(--card)}
.track{display:flex;transition:transform .5s ease}
.slide{min-width:100%;min-height:clamp(170px,32vw,320px);display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,5vw,56px);color:#fff;cursor:pointer;background-size:cover;background-position:center}
.slide b{font-size:clamp(1.5rem,5vw,3rem);line-height:1.1;max-width:18ch}
.slide span{font-size:clamp(1rem,2.4vw,1.3rem);margin:8px 0 14px}
.slide em{align-self:flex-start;background:#fff;color:#222;padding:8px 16px;border-radius:8px;font-weight:700;font-style:normal}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#222;font-size:1.6rem;line-height:1;cursor:pointer}
.arr:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prev{left:10px}.next{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{width:9px;height:9px;border-radius:5px;border:0;background:rgba(255,255,255,.55);cursor:pointer;padding:0}
.dots button.on{background:#fff;width:22px}
.tile{background:#ffe9b8;color:#3a2200;border-radius:12px;padding:22px 6px 10px;text-align:center;font-weight:700;font-size:.95rem;cursor:pointer;border:0}
.tile i{display:block;font-style:normal;font-size:2.2rem;margin-bottom:6px}
h2{font-size:1.4rem;font-weight:500;margin:26px 0 12px}
.shop{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.side h4{margin:0 0 8px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.side button.on{background:var(--bg);color:var(--brand);font-weight:700}
.sort{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sort select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:4rem}
.pic img{width:100%;height:100%;object-fit:cover}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-size:.92rem;color:var(--muted)}
.pr{font-size:1.15rem;font-weight:700}
.pr s{font-weight:400;font-size:.85rem;color:var(--muted);margin:0 4px}
.pr em{font-style:normal;font-weight:600;font-size:.85rem;color:var(--green)}
.rt{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.rt b{background:var(--green);color:#fff;border-radius:999px;padding:1px 8px}
.add{margin-top:auto;border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:8px;padding:7px;font-weight:700;cursor:pointer}
.add:focus-visible,.go:focus-visible,.cartbtn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}
#cart{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;z-index:6}
#cart.open{transform:none}
#cart .items{flex:1;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.row button{width:26px;height:26px;border:1px solid var(--line);background:none;border-radius:6px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 0}
.go{display:block;text-align:center;background:var(--brand);color:var(--onbrand);padding:11px;border-radius:8px;font-weight:700;text-decoration:none}
.x{align-self:flex-end;background:none;border:0;font-size:1.6rem;cursor:pointer}
.nocat .nav,.nocat .side{display:none}.nocat .shop{grid-template-columns:1fr}
@media (max-width:820px){.shop{grid-template-columns:1fr}.side{display:none}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){#cart,.track{transition:none}}
</style>
</head>
<body>
<div class="top">
 <div class="bar"><div class="logo">GlobalMall</div><input class="search" id="q" type="search" placeholder="Search products" aria-label="Search"><button class="cartbtn" id="open">Cart (<span id="count">0</span>)</button></div>
 <nav class="nav" id="nav"></nav>
</div>
<div class="wrap">
 <section class="slider" aria-roledescription="carousel" aria-label="Offers">
  <div class="track" id="track"></div>
  <button class="arr prev" id="prev" aria-label="Previous slide">&#8249;</button>
  <button class="arr next" id="next" aria-label="Next slide">&#8250;</button>
  <div class="dots" id="dots"></div>
 </section>
 <div class="tiles">
   <button class="tile" data-sort="rel"><i>🔥</i>Trending Now</button>
   <button class="tile" data-sort="low"><i>💸</i>Budget Buys</button>
   <button class="tile" data-sort="rating"><i>⭐</i>Top Rated Picks</button>
   <button class="tile" data-sort="high"><i>💎</i>Premium Picks</button>
 </div>
 <h2 id="shop">Products For You</h2>
 <div class="shop">
  <aside class="side"><h4>Category</h4><div id="cats"></div></aside>
  <main>
   <div class="sort"><span id="num" class="nm"></span><select id="sort" aria-label="Sort by"><option value="rel">Sort by: Relevance</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Rating</option></select></div>
   <div class="grid" id="grid"></div>
  </main>
 </div>
</div>
<aside id="cart" aria-label="Cart"><button class="x" id="close" aria-label="Close cart">&times;</button><h3>Your cart</h3><div class="items" id="items"></div><div class="tot"><span>Total</span><span id="total"></span></div><a class="go" id="wa" href="#" target="_blank" rel="noopener">Order on WhatsApp</a></aside>
<script>
// ===== EDIT HERE: apna WhatsApp number aur products =====
var WHATSAPP = "91XXXXXXXXXX"; // country code ke saath, bina +
// cat: abhi khali hai. Baad me category rakhni ho to yahan likhein, menu apne aap aa jayega.
// img: apni photo ka naam (jaise "bag1.jpg") jo isi folder me upload karein. Khali ho to emoji dikhega.
var PRODUCTS = [
 {id:1,name:"Red Floral Embroidered Handbag (26x10x20 cm)",cat:"",price:999,mrp:1799,rating:4.3,reviews:120,emoji:"👜",bg:"#f7d6dc",img:""},
 {id:2,name:"Sample Product 2",cat:"",price:749,mrp:1299,rating:4.1,reviews:86,emoji:"🛍️",bg:"#e1dbee",img:""},
 {id:3,name:"Sample Product 3",cat:"",price:499,mrp:999,rating:3.9,reviews:54,emoji:"🛍️",bg:"#fde7c4",img:""},
 {id:4,name:"Sample Product 4",cat:"",price:299,mrp:799,rating:4.2,reviews:310,emoji:"🛍️",bg:"#d9ecdf",img:""},
 {id:5,name:"Sample Product 5",cat:"",price:149,mrp:399,rating:4.0,reviews:210,emoji:"🛍️",bg:"#fde7c4",img:""},
 {id:6,name:"Sample Product 6",cat:"",price:449,mrp:999,rating:4.4,reviews:640,emoji:"🛍️",bg:"#d8e6f7",img:""},
 {id:7,name:"Sample Product 7",cat:"",price:599,mrp:1499,rating:4.2,reviews:402,emoji:"🛍️",bg:"#f7d6dc",img:""},
 {id:8,name:"Sample Product 8",cat:"",price:199,mrp:499,rating:4.1,reviews:158,emoji:"🛍️",bg:"#d9ecdf",img:""}
];
// ========================================================
var CATS=["All"].concat(PRODUCTS.map(function(p){return p.cat}).filter(function(c,i,a){return c&&a.indexOf(c)===i}));
var st={cat:"All",sort:"rel",q:""},cart={};
function $(i){return document.getElementById(i)}
function inr(n){return "Rs. "+n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function catUI(){
 $("nav").innerHTML=CATS.map(function(c){return '<button data-cat="'+esc(c)+'" class="'+(c===st.cat?"on":"")+'">'+esc(c)+'</button>'}).join("");
 $("cats").innerHTML=CATS.map(function(c){return '<button data-cat="'+esc(c)+'" class="'+(c===st.cat?"on":"")+'">'+esc(c)+'</button>'}).join("");
}
function list(){
 var a=PRODUCTS.filter(function(p){return (st.cat==="All"||p.cat===st.cat)&&p.name.toLowerCase().indexOf(st.q.toLowerCase())>-1});
 if(st.sort==="low")a.sort(function(x,y){return x.price-y.price});
 if(st.sort==="high")a.sort(function(x,y){return y.price-x.price});
 if(st.sort==="rating")a.sort(function(x,y){return y.rating-x.rating});
 $("num").textContent=a.length+" products";
 $("grid").innerHTML=a.length?a.map(function(p){
  var off=Math.round((1-p.price/p.mrp)*100);
  var pic=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">':p.emoji;
  return '<div class="card"><div class="pic" style="background:'+p.bg+'">'+pic+'</div><div class="cb"><div class="nm">'+esc(p.name)+'</div><div class="pr">'+inr(p.price)+'<s>'+inr(p.mrp)+'</s><em>'+off+'% off</em></div><div class="rt"><b>'+p.rating+' &#9733;</b>'+p.reviews+' Reviews</div><button class="add" data-add="'+p.id+'">Add to cart</button></div></div>';
 }).join(""):'<div class="empty">Koi product nahi mila. Doosra naam try karein.</div>';
}
function setCart(){
 var n=0,t=0,m="Hello GlobalMall, I want to order:\n",h="";
 PRODUCTS.forEach(function(p){var q=cart[p.id];if(!q)return;n+=q;t+=q*p.price;m+=q+" x "+p.name+" = "+inr(q*p.price)+"\n";
  h+='<div class="row"><span>'+esc(p.name)+'</span><span><button data-m="'+p.id+'" aria-label="Decrease">-</button> '+q+' <button data-p="'+p.id+'" aria-label="Increase">+</button></span></div>'});
 $("items").innerHTML=h||'<p class="nm">Cart khali hai.</p>';
 $("count").textContent=n;$("total").textContent=inr(t);
 $("wa").href=n?"https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m+"Total: "+inr(t)):"#";
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-cat],[data-sort],[data-add],[data-m],[data-p]");if(!t)return;
 if(t.dataset.cat){st.cat=t.dataset.cat;catUI();list();$("shop").scrollIntoView()}
 if(t.dataset.sort){st.sort=t.dataset.sort;$("sort").value=st.sort;list();$("shop").scrollIntoView()}
 if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;setCart();$("cart").classList.add("open")}
 if(t.dataset.m){var k=t.dataset.m;cart[k]--;if(cart[k]<=0)delete cart[k];setCart()}
 if(t.dataset.p){cart[t.dataset.p]++;setCart()}
});
$("q").oninput=function(){st.q=this.value;list()};
$("sort").onchange=function(){st.sort=this.value;list()};
$("open").onclick=function(){$("cart").classList.add("open")};
$("close").onclick=function(){$("cart").classList.remove("open")};
// ===== SLIDER: yahan apne slides badlein (img me photo ka naam daalein, jaise "slide1.jpg") =====
var SLIDES=[
 {t:"Welcome to GlobalMall",s:"Apni pasand ka saaman, ek hi jagah",o:"rel",bg:"linear-gradient(120deg,#4a2fa3,#8b6df0)",img:""},
 {t:"Naye Products",s:"Hamare naye aaye products dekhein",o:"rel",bg:"linear-gradient(120deg,#8e1b3a,#d6456b)",img:""},
 {t:"Budget Buys",s:"Kam daam me achhi cheezein",o:"low",bg:"linear-gradient(120deg,#2f5d50,#5aa88d)",img:""},
 {t:"Top Rated Picks",s:"Customers ki sabse pasandida",o:"rating",bg:"linear-gradient(120deg,#b45309,#f59e0b)",img:""}
];
var si=0,timer;
$("track").innerHTML=SLIDES.map(function(x){
 var bg=x.img?"background-image:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05)),url('"+esc(x.img)+"')":"background:"+x.bg;
 return '<div class="slide" data-sort="'+x.o+'" style="'+bg+'"><b>'+esc(x.t)+'</b><span>'+esc(x.s)+'</span><em>Shop Now</em></div>';
}).join("");
$("dots").innerHTML=SLIDES.map(function(x,i){return '<button data-i="'+i+'" aria-label="Slide '+(i+1)+'"></button>'}).join("");
function go(i){
 si=(i+SLIDES.length)%SLIDES.length;
 $("track").style.transform="translateX(-"+(si*100)+"%)";
 [].forEach.call($("dots").children,function(d,k){d.className=k===si?"on":""});
}
function play(){
 clearInterval(timer);
 if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(function(){go(si+1)},4500);
}
$("prev").onclick=function(){go(si-1);play()};
$("next").onclick=function(){go(si+1);play()};
$("dots").onclick=function(e){var i=e.target.getAttribute("data-i");if(i!==null){go(+i);play()}};
var sl=document.querySelector(".slider"),x0=null;
sl.onmouseenter=function(){clearInterval(timer)};
sl.onmouseleave=play;
sl.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
sl.addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40){go(si+(d<0?1:-1));play()}x0=null});
go(0);play();
if(CATS.length<2)document.body.classList.add("nocat");
catUI();list();setCart();
</script>
</body>
</html>
